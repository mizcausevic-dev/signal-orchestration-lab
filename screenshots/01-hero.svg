  <text x="90" y="218" fill="#F4EDD8" font-family="Georgia, serif" font-size="66" font-weight="700">
    <tspan x="90" dy="0">Turn disconnected pressure into</tspan>
    <tspan x="90" dy="72">a response order the business can follow.</tspan>
  </text>
  <text x="90" y="340" fill="#AEBAD0" font-family="Segoe UI, Arial, sans-serif" font-size="28">
    <tspan x="90" dy="0">Signal nodes arrive from revenue, growth, AI, customer, ops, and security.</tspan>
    <tspan x="90" dy="38">The engine scores urgency, respects dependencies, and routes action in sequence.</tspan>
  </text>
  <rect x="90" y="432" width="294" height="160" rx="24" fill="#17263B" stroke="#294365"/>
  <rect x="414" y="432" width="294" height="160" rx="24" fill="#17263B" stroke="#294365"/>
  <rect x="738" y="432" width="294" height="160" rx="24" fill="#17263B" stroke="#294365"/>
  <rect x="1062" y="432" width="294" height="160" rx="24" fill="#17263B" stroke="#294365"/>
  <text x="122" y="480" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="18">ORCHESTRATIONS</text>
  <text x="122" y="546" fill="#F4EDD8" font-family="Georgia, serif" font-size="54" font-weight="700">9</text>
  <text x="122" y="578" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24">Live cross-functional playbooks</text>
  <text x="446" y="480" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="18">NODES MODELED</text>
  <text x="446" y="546" fill="#F4EDD8" font-family="Georgia, serif" font-size="54" font-weight="700">34</text>
  <text x="446" y="578" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24">Signals normalized into one graph</text>
  <text x="770" y="480" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="18">ESCALATED PATHS</text>
  <text x="770" y="546" fill="#F4EDD8" font-family="Georgia, serif" font-size="54" font-weight="700">4</text>
  <text x="770" y="578" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24">Chains already above executive threshold</text>
