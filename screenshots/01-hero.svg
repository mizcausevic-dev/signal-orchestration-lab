  <text x="1094" y="546" fill="#F4EDD8" font-family="Georgia, serif" font-size="54" font-weight="700">0.84</text>
  <text x="1094" y="578" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="24">Strong enough to coordinate action</text>
  <rect x="90" y="636" width="1266" height="164" rx="24" fill="#162334" stroke="#294162"/>
  <text x="124" y="690" fill="#F2B7D8" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="6">LEAD ORCHESTRATION</text>
  <text x="124" y="744" fill="#F4EDD8" font-family="Georgia, serif" font-size="44" font-weight="700">
