<svg width="1440" height="900" viewBox="0 0 1440 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1440" height="900" fill="#07121C"/>
  <rect x="60" y="48" width="1320" height="804" rx="36" fill="#101B29" stroke="#233652" stroke-width="2"/>
  <text x="104" y="126" fill="#81D0FF" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="8">SIGNAL ORCHESTRATION LAB</text>
  <text x="104" y="214" fill="#F4EDD8" font-family="Georgia, serif" font-size="58" font-weight="700">
    <tspan x="104" dy="0">Turn disconnected pressure into</tspan>
    <tspan x="104" dy="64">a response order the business can follow.</tspan>
  </text>
  <text x="104" y="320" fill="#AEBAD0" font-family="Segoe UI, Arial, sans-serif" font-size="24">
    <tspan x="104" dy="0">Signal nodes arrive from revenue, growth, AI, customer, ops, and security.</tspan>
    <tspan x="104" dy="32">The engine scores urgency, respects dependencies, and routes action in sequence.</tspan>
  </text>

  <rect x="104" y="404" width="286" height="176" rx="22" fill="#17263B" stroke="#294365"/>
  <rect x="414" y="404" width="286" height="176" rx="22" fill="#17263B" stroke="#294365"/>
  <rect x="724" y="404" width="286" height="176" rx="22" fill="#17263B" stroke="#294365"/>
  <rect x="1034" y="404" width="286" height="176" rx="22" fill="#17263B" stroke="#294365"/>

  <text x="134" y="452" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="16">ORCHESTRATIONS</text>
  <text x="134" y="522" fill="#F4EDD8" font-family="Georgia, serif" font-size="50" font-weight="700">9</text>
  <text x="134" y="554" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <tspan x="134" dy="0">Cross-functional playbooks</tspan>
    <tspan x="134" dy="26">ready for sequencing</tspan>
  </text>

  <text x="444" y="452" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="16">NODES MODELED</text>
  <text x="444" y="522" fill="#F4EDD8" font-family="Georgia, serif" font-size="50" font-weight="700">34</text>
  <text x="444" y="554" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <tspan x="444" dy="0">Signals normalized into</tspan>
    <tspan x="444" dy="26">one dependency graph</tspan>
  </text>

  <text x="754" y="452" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="16">ESCALATED PATHS</text>
  <text x="754" y="522" fill="#F4EDD8" font-family="Georgia, serif" font-size="50" font-weight="700">4</text>
  <text x="754" y="554" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <tspan x="754" dy="0">Chains already above</tspan>
    <tspan x="754" dy="26">executive threshold</tspan>
  </text>

  <text x="1064" y="452" fill="#9AA9C9" font-family="Segoe UI, Arial, sans-serif" font-size="16">AVG. CONFIDENCE</text>
  <text x="1064" y="522" fill="#F4EDD8" font-family="Georgia, serif" font-size="50" font-weight="700">0.84</text>
  <text x="1064" y="554" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">
    <tspan x="1064" dy="0">High enough to</tspan>
    <tspan x="1064" dy="26">coordinate action</tspan>
  </text>

  <rect x="104" y="620" width="1216" height="160" rx="22" fill="#162334" stroke="#294162"/>
  <text x="136" y="674" fill="#F2B7D8" font-family="Segoe UI, Arial, sans-serif" font-size="20" letter-spacing="6">LEAD ORCHESTRATION</text>
  <text x="136" y="726" fill="#F4EDD8" font-family="Georgia, serif" font-size="38" font-weight="700">
    <tspan x="136" dy="0">Stabilize pipeline coverage first,</tspan>
    <tspan x="136" dy="44">then unwind routing, attribution, and identity drag.</tspan>
  </text>
  <text x="136" y="792" fill="#B3BED4" font-family="Segoe UI, Arial, sans-serif" font-size="21">
    Orchestration logic for operating systems, not just one more analytics API.
  </text>
</svg>

