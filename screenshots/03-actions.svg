  <rect x="70" y="56" width="1300" height="788" rx="34" fill="#10192A" stroke="#223454" stroke-width="2"/>
  <text x="118" y="130" fill="#81D0FF" font-family="Segoe UI, Arial, sans-serif" font-size="22" letter-spacing="8">ROUTED ACTIONS</text>
  <text x="118" y="210" fill="#F4EDD8" font-family="Georgia, serif" font-size="58" font-weight="700">
    <tspan x="118" dy="0">Sequence the response chain,</tspan>
    <tspan x="118" dy="64">don’t just tag owners and hope.</tspan>
  </text>
  <rect x="118" y="330" width="1204" height="126" rx="24" fill="#17263B" stroke="#294365"/>
  <rect x="118" y="484" width="1204" height="126" rx="24" fill="#17263B" stroke="#294365"/>
  <rect x="118" y="638" width="1204" height="126" rx="24" fill="#17263B" stroke="#294365"/>
  <text x="152" y="380" fill="#F36B8A" font-family="Segoe UI, Arial, sans-serif" font-size="22">1 · CRITICAL · Revenue Operations · 8 days</text>
  <text x="152" y="426" fill="#F4EDD8" font-family="Georgia, serif" font-size="34" font-weight="700">Coordinate around pipeline coverage compression</text>
  <text x="152" y="446" fill="#B7C1D7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Highest pressure node with two downstream dependencies across growth and ops.</text>
  <text x="152" y="534" fill="#F7B24D" font-family="Segoe UI, Arial, sans-serif" font-size="22">2 · HIGH · Growth Analytics · 6 days</text>
  <text x="152" y="580" fill="#F4EDD8" font-family="Georgia, serif" font-size="34" font-weight="700">Coordinate around attribution confidence drift</text>
  <text x="152" y="600" fill="#B7C1D7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Fixing source clarity prevents the commercial team from optimizing around blurred signals.</text>
  <text x="152" y="688" fill="#86F1A8" font-family="Segoe UI, Arial, sans-serif" font-size="22">3 · HIGH · Operations · 5 days</text>
  <text x="152" y="734" fill="#F4EDD8" font-family="Georgia, serif" font-size="34" font-weight="700">Coordinate around routing backlog spillover</text>
  <text x="152" y="754" fill="#B7C1D7" font-family="Segoe UI, Arial, sans-serif" font-size="22">Backlog cleanup only pays off after the commercial pressure order is understood.</text>
</svg>

