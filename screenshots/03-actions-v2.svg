  <text x="150" y="374" fill="#F36B8A" font-family="Segoe UI, Arial, sans-serif" font-size="20">1 · CRITICAL · Revenue Operations · 8 days</text>
  <text x="150" y="420" fill="#F4EDD8" font-family="Georgia, serif" font-size="32" font-weight="700">Coordinate around pipeline coverage compression</text>
  <text x="150" y="452" fill="#B7C1D7" font-family="Segoe UI, Arial, sans-serif" font-size="21">
