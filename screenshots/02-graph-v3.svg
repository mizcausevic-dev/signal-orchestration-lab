  <circle cx="1160" cy="324" r="72" fill="#1A2A43" stroke="#34598A" stroke-width="2"/>
  <path d="M324 474L474 558" stroke="#7DD3FC" stroke-width="6"/>
  <path d="M634 560L786 456" stroke="#7DD3FC" stroke-width="6"/>
