  <text x="460" y="616" fill="#F4EDD8" font-family="Georgia, serif" font-size="24" font-weight="700">Routing backlog</text>

  <text x="832" y="402" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">Growth</text>
  <text x="776" y="432" fill="#F4EDD8" font-family="Georgia, serif" font-size="24" font-weight="700">Attribution drift</text>

  <text x="1116" y="586" fill="#FFFFFF" font-family="Segoe UI, Arial, sans-serif" font-size="19">Security</text>
